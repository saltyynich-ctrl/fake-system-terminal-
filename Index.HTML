<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>System Console</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #00ff55;
      font-family: monospace;
    }

    #screen {
      box-sizing: border-box;
      width: 100vw;
      min-height: 100vh;
      padding: 18px;
      font-size: 17px;
      line-height: 1.55;
      overflow: auto;
      background: #000;
    }

    .red {
      color: #ff2222;
      font-weight: bold;
    }

    .big {
      color: #00ff55;
      font-size: 32px;
      font-weight: bold;
      margin-top: 35px;
    }
  </style>
</head>

<body>

<div id="screen"></div>

<script>
const screen = document.getElementById("screen");

const codes = [
  "INITIALIZING SYSTEM...",
  "CONNECTING TO SERVER...",
  "AUTHENTICATION: 7F3A-92KD",
  "LOADING MODULE X_4F9A...",
  "EXECUTING 0x4A 0x91 0xFF 0x32",
  "DECRYPTING DATA BLOCK 001...",
  "DECRYPTING DATA BLOCK 002...",
  "DECRYPTING DATA BLOCK 003...",
  "KEY FOUND: 9A-77-C4-21",
  "ACCESS PROTOCOL: 8841",
  "RUNNING SYSTEM CHECK...",
  "SCANNING USER DIRECTORY...",
  "READING CONFIGURATION...",
  "PROCESS ID: 47291",
  "PROCESS ID: 47292",
  "PROCESS ID: 47293",
  "UPLOADING DATA...",
  "OVERRIDE SEQUENCE: 19-44-82",
  "FIREWALL STATUS: BYPASSED",
  "SECURITY LAYER: DISABLED",
  "ROOT ACCESS: GRANTED",
  "ACCESSING SYSTEM...",
  "FINALIZING..."
];

let i = 0;

function add(text, className = "") {
  const line = document.createElement("div");
  line.className = className;
  line.textContent = "> " + text;
  screen.appendChild(line);
  screen.scrollTop = screen.scrollHeight;
}

function run() {
  if (i < codes.length) {
    add(codes[i]);
    i++;

    setTimeout(run, 150 + Math.random() * 300);
  } else {
    setTimeout(() => {

      add("!!! SYSTEM COMPROMISED !!!", "red");
      add("UNKNOWN USER HAS ENTERED THE SYSTEM", "red");
      add("SECURITY RESPONSE FAILED", "red");
      add("ALL SECURITY PROTOCOLS OFFLINE", "red");

      const final = document.createElement("div");
      final.className = "big";
      final.textContent = "ACCESS GRANTED";

      screen.appendChild(final);
      screen.scrollTop = screen.scrollHeight;

    }, 1000);
  }
}

add("SYSTEM CONSOLE v6.28");
add("------------------------------");

setTimeout(run, 800);
</script>

</body>
</html>
